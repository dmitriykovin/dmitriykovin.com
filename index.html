<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dmitriy Kovin | DJ & Model</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background: #0a0a0a; color: #f1f1f1; font-family: system-ui, -apple-system, sans-serif; }
    .hero { height: 100vh; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)), url('IMG_6044.JPG') center/cover no-repeat; }
    .nav-link { transition: all 0.3s; }
    .nav-link:hover { color: #c026d3; letter-spacing: 1px; }
    img { transition: transform 0.6s ease; }
    img:hover { transform: scale(1.03); }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="fixed top-0 w-full bg-black/80 backdrop-blur-md z-50 py-6">
    <div class="max-w-6xl mx-auto px-8 flex justify-between items-center">
      <h1 class="text-2xl font-light tracking-widest">DMITRIY KOVIN</h1>
      <div class="flex gap-10 text-sm uppercase tracking-widest">
        <a href="#work" class="nav-link">Work</a>
        <a href="#about" class="nav-link">About</a>
        <a href="#music" class="nav-link">Music</a>
        <a href="#contact" class="nav-link">Contact</a>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero flex items-center justify-center text-center relative">
    <div class="max-w-3xl px-6">
      <h2 class="text-6xl md:text-7xl font-light tracking-tight mb-6">DJ & MODEL</h2>
      <p class="text-xl text-gray-300">St. Petersburg • Koh Phangan</p>
    </div>
  </section>

  <!-- WORK / GALLERY -->
  <section id="work" class="py-24">
    <div class="max-w-6xl mx-auto px-8">
      <h2 class="text-5xl font-light mb-12 text-center">Selected Works</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Добавляй свои фото сюда -->
        <img src="IMG_6044.JPG" class="w-full aspect-[4/5] object-cover rounded-xl cursor-pointer" onclick="openLightbox(this)">
        <img src="IMG_6045.JPG" class="w-full aspect-[4/5] object-cover rounded-xl cursor-pointer" onclick="openLightbox(this)">
        <!-- ... и остальные -->
      </div>
    </div>
  </section>

  <!-- ABOUT, MUSIC, CONTACT — можно добавить позже -->

  <!-- Lightbox -->
  <div id="lightbox" class="fixed inset-0 bg-black/95 hidden flex items-center justify-center z-50">
    <button onclick="closeLightbox()" class="absolute top-8 right-8 text-4xl text-white">×</button>
    <img id="lightbox-img" class="max-h-[90vh] max-w-[90%] rounded-2xl">
  </div>

  <script>
    function openLightbox(img) {
      document.getElementById('lightbox-img').src = img.src;
      document.getElementById('lightbox').classList.remove('hidden');
      document.getElementById('lightbox').classList.add('flex');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
      document.getElementById('lightbox').classList.remove('flex');
    }
  </script>
</body>
</html>
